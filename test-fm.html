<!doctype html>
<html>
  <head>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        background: yellow;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { motion, useAnimation } = window.Motion;
      const { useEffect } = React;
      function App() {
        const controls = useAnimation();
        useEffect(() => {
          async function run() {
            await controls.start({
              pathLength: [0, 0.15, 0.9, 1],
              strokeWidth: [80, 80, 80, 3000],
              transition: { duration: 1.25, times: [0, 0.15, 0.9, 1], ease: "easeOut" },
            });
            await new Promise((r) => setTimeout(r, 500));
            await controls.start({
              pathLength: [1, 1, 0, 0],
              pathOffset: [0, 0, 1, 1],
              strokeWidth: [3000, 80, 80, 80],
              transition: { duration: 1.25, times: [0, 0.05, 0.95, 1], ease: "easeOut" },
            });
          }
          run();
        }, []);
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 50, pointerEvents: "none" }}>
            <svg
              viewBox="0 0 1080 1080"
              preserveAspectRatio="none"
              style={{ width: "100vw", height: "100vh", color: "#2b1b81" }}
            >
              <motion.path
                d="M66.858-19C57.597 196.452 127.164 482.585 206.5 464.5c125.428-28.592 52.293-293.51 200.001-339 568.234-175-241.425 712.6 15.5 803.02C645 1007 629.398 499 810.5 499c113.398 0 106.54 189.465 164.235 429.52 48.005 199.72 89.415 213.09 105.265 173.78"
                stroke="currentColor"
                strokeLinecap="round"
                strokeLinejoin="round"
                fill="none"
                initial={{ pathLength: 0, strokeWidth: 80, pathOffset: 0 }}
                animate={controls}
              />
            </svg>
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
