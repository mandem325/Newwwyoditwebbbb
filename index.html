    <script>
      (function() {
        try {
          // Rule 1: Always default to LIGHT mode on both mobile and desktop.
          // Rule 2: Completely ignore system/browser dark mode (prefers-color-scheme).
          // Rule 3: Mobile view (< 1024px) is strictly light mode ("unless it changed manually only on desktop view").
          var isDesktop = window.innerWidth >= 1024;
          var stored = localStorage.getItem('theme');
          if (isDesktop && stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
