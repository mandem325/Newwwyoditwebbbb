<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: gray;
      }
      .yellow-wrapper {
        position: relative;
        z-index: 0;
        background: #fed648;
        height: 200px;
      }
      .blue-wave {
        position: absolute;
        top: 100px;
        left: 50px;
        width: 100px;
        height: 300px;
        background: blue;
        z-index: 10;
      }
      .yellow-text {
        position: relative;
        z-index: 20;
        color: black;
        font-size: 24px;
        padding: 20px;
      }

      .purple-wrapper {
        position: relative;
        height: 300px;
        overflow: hidden;
        margin-top: -2px;
      }
      .purple-bg {
        position: absolute;
        inset: 0;
        background: #7d1880;
        z-index: 0;
      }
      .purple-text {
        position: relative;
        z-index: 20;
        color: white;
        font-size: 24px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="yellow-wrapper">
      <div class="blue-wave"></div>
      <div class="yellow-text">YELLOW TEXT</div>
    </div>
    <div class="purple-wrapper">
      <div class="purple-bg"></div>
      <div class="purple-text">PURPLE TEXT</div>
    </div>
  </body>
</html>
